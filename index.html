<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Asistente de WhatsApp · Pureza Natural</title></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;600&display=swap">
<style>
:root { --bg:#F4F1E9; --panel:#FBF9F4; --verde:#174C46; --teal:#007585; --txt:#24302E; --suave:#4E5D58; --linea:#DDD6C6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101C1A; --panel:#172623; --verde:#8FD0C6; --teal:#5CC3D3; --txt:#E6EEEB; --suave:#A9B8B3; --linea:#2B3E3A; color-scheme: dark } }
:root[data-theme="dark"] { --bg:#101C1A; --panel:#172623; --verde:#8FD0C6; --teal:#5CC3D3; --txt:#E6EEEB; --suave:#A9B8B3; --linea:#2B3E3A; color-scheme: dark }
body { background: var(--bg); color: var(--txt); font-family: Figtree, system-ui, sans-serif; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 1000px; margin: 0 auto; display: grid; gap: 20px; }
.eb { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--teal); }
h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(28px, 6vw, 42px); line-height: 1.05; color: var(--verde); margin: 4px 0 8px; text-wrap: balance; }
p { margin: 0; color: var(--suave); line-height: 1.5; max-width: 62ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--linea); }
figcaption b { display: block; font-family: 'Bricolage Grotesque', sans-serif; color: var(--verde); font-size: 18px; }
figcaption span { color: var(--suave); font-size: 14px; }
</style>
<main>
  <div>
    <div class="eb">Pureza Natural · Distribuidor autorizado AguaLogic</div>
    <h1>Asistente de WhatsApp: cómo se vería</h1>
    <p>Documento ilustrativo: el asistente aún no está conectado a un número real. <a href="presentacion-asistente-whatsapp.pdf">Abrir la presentación en PDF</a>. Debajo, las ocho imágenes que acompañan las respuestas.</p>
  </div>
  <div class="grid">
    <figure><img src="banners/01-funcionamiento.jpg" alt="Así funciona por gravedad"><figcaption><b>¿Cómo funciona?</b><span>Por gravedad, sin electricidad</span></figcaption></figure>
    <figure><img src="banners/02-curacion.jpg" alt="Así se cura tu purificador nuevo"><figcaption><b>¿Qué hago al recibirlo?</b><span>Curación del purificador nuevo</span></figcaption></figure>
    <figure><img src="banners/03-mantenimiento.jpg" alt="Cómo cuidar tu purificador"><figcaption><b>¿Cómo lo cuido y cuándo cambio la cerámica?</b><span>Mantenimiento y repuesto</span></figcaption></figure>
    <figure><img src="banners/04-tamanos.jpg" alt="Elige el tamaño para tu hogar"><figcaption><b>¿Qué tamaños y modelos hay?</b><span>Los cuatro modelos con sus medidas</span></figcaption></figure>
    <figure><img src="banners/05-laboratorio.jpg" alt="Lo que dice el laboratorio"><figcaption><b>¿De verdad funciona?</b><span>Resultados de laboratorio, con su condición</span></figcaption></figure>
    <figure><img src="banners/06-garantia.jpg" alt="Lo que cubre tu garantía"><figcaption><b>¿Y si se daña?</b><span>Garantía AguaLogic gestionada por nosotros</span></figcaption></figure>
    <figure><img src="banners/07-envio.jpg" alt="Cómo lo recibes y cómo pagas"><figcaption><b>¿Cómo lo recibo y cómo pago?</b><span>Envío y formas de pago</span></figcaption></figure>
    <figure><img src="banners/08-elige-tamano-meson.jpg" alt="Elige el tamaño que cabe en tu mesón"><figcaption><b>¿Cabe en mi cocina?</b><span>Medidas reales a escala</span></figcaption></figure>
  </div>
</main>
</body></html>
